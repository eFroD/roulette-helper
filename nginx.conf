server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Declared explicitly rather than inherited: ES module imports are blocked
    # outright if .js arrives with the wrong MIME type, and that failure mode
    # is invisible until the tablet shows a blank board.
    types {
        text/html        html;
        text/css         css;
        text/javascript  js mjs;
        image/png        png;
        image/svg+xml    svg;
        image/x-icon     ico;
        application/manifest+json  webmanifest;
    }
    default_type application/octet-stream;

    # The host edits config.js and reloads. A cached copy would make that edit
    # look like it did nothing, so these two are never stored.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location = / {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
